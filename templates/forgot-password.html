<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нууц үг сэргээх - {{ brand_name }}</title>
    {% include "partials/head_meta.html" with context %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=ux3">
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <div class="text-center mb-4">
            <a href="/" class="text-decoration-none text-dark">
                <img src="/static/logo.png" height="48" alt="{{ brand_name }}" style="border-radius:10px;margin:0 auto 0.75rem">
                <div style="font-family:var(--font-display);font-weight:800;font-size:1.6rem;letter-spacing:-0.03em">{{ brand_name }}</div>
            </a>
        </div>
        <h3 class="text-center mb-2">Нууц үг сэргээх</h3>
        <p class="text-center text-secondary small mb-3">
            Бүртгэлтэй утас болон нэрээ оруулж шинэ нууц үг тохируулна.
        </p>
        <form id="resetForm">
            <div class="mb-3">
                <label class="form-label fw-bold">Утас</label>
                <input name="phone" class="form-control" pattern="[6-9][0-9]{7}" maxlength="8" inputmode="numeric" autocomplete="tel" required>
                <div class="form-text">8 оронтой утасны дугаар (жишээ: 99112233)</div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Бүртгэлийн нэр</label>
                <input name="name" class="form-control" required autocomplete="name">
                <div class="form-text">Бүртгүүлэхэд ашигласан нэр</div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Шинэ нууц үг</label>
                <input type="password" name="password" class="form-control" minlength="6" required>
            </div>
            <button class="btn-zamch btn-zamch-primary w-100">Шинэчлэх</button>
            <div id="msg" class="small mt-2 text-danger"></div>
        </form>
        <div class="text-center mt-3 small"><a href="/login" id="loginLink">Нэвтрэх рүү буцах</a></div>
    </div>
</div>
<script>
const params = new URLSearchParams(location.search);
const nextUrl = params.get('next') || '';
function safeNext(url) {
    if (!url || !url.startsWith('/') || url.startsWith('//')) return null;
    return url;
}
if (nextUrl) {
    const login = document.getElementById('loginLink');
    if (login) login.href = '/login?next=' + encodeURIComponent(nextUrl);
}
document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('msg');
    msg.className = 'small mt-2 text-danger';
    const res = await fetch('/api/auth/reset-password', { method: 'POST', body: new FormData(e.target) });
    if (res.ok) {
        const dest = safeNext(nextUrl);
        location.href = dest ? '/login?next=' + encodeURIComponent(dest) : '/login';
    } else {
        const err = await res.json().catch(() => ({}));
        msg.textContent = err.detail || 'Алдаа гарлаа';
    }
});
</script>
</body>
</html>
