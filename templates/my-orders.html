<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Миний захиалгууд - ЗАМЧ</title>
    {% include "partials/head_meta.html" with context %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/style.css?v=ux3">
</head>
<body class="zamch-shell site-bg">
{% include "partials/nav.html" %}

<main class="zamch-main">
    <div class="container py-4 py-md-5">
        <header class="page-head">
            <h1 class="page-title">Миний захиалгууд</h1>
        </header>
        <div id="ordersList" class="orders-list"></div>
    </div>
</main>

{% include "partials/footer.html" %}

<script src="/static/shop.js?v=ux3"></script>
<script>
const statusLabels = {
    pending: 'Хүлээгдэж байна',
    confirmed: 'Баталгаажсан',
    preparing: 'Бэлтгэж байна',
    out_for_delivery: 'Хүргэлтэд гарсан',
    completed: 'Хүргэгдсэн',
    cancelled: 'Цуцлагдсан'
};
const steps = [
    ['pending', 'Захиалсан'],
    ['confirmed', 'Баталгаажсан'],
    ['preparing', 'Бэлтгэж байна'],
    ['out_for_delivery', 'Хүргэлтэд'],
    ['completed', 'Хүргэгдсэн']
];

function orderTimeline(order) {
    if (order.status === 'cancelled') {
        return '<div class="order-cancelled"><i class="bi bi-x-circle"></i> Захиалга цуцлагдсан</div>';
    }
    const current = Math.max(0, steps.findIndex(([status]) => status === order.status));
    return `<div class="order-timeline">
      ${steps.map(([status, label], index) => `
        <div class="order-step ${index < current ? 'is-done' : ''} ${index === current ? 'is-current' : ''}">
          <span class="order-step-dot">${index < current ? '<i class="bi bi-check"></i>' : ''}</span>
          <span>${label}</span>
        </div>`).join('')}
    </div>`;
}

function paymentLabel(order) {
    const methods = { qpay: 'QPay', bank_transfer: 'Шилжүүлэг', cod: 'Хүргэлтээр' };
    return `${methods[order.payment_method] || order.payment_method} · ${order.payment_status === 'paid' ? 'Төлсөн' : 'Төлөөгүй'}`;
}

async function loadOrders() {
    const me = await (await fetch('/api/auth/me')).json();
    if (!me.user) {
        location.href = '/login?next=' + encodeURIComponent('/my-orders');
        return;
    }
    const res = await fetch('/api/orders/mine');
    const orders = (await res.json()).data || [];
    const box = document.getElementById('ordersList');
    if (!orders.length) {
        box.innerHTML = emptyState('Захиалга байхгүй', `<a href="/" class="btn-zamch btn-zamch-primary btn-sm">Бараа хайх</a>`);
        return;
    }

    box.innerHTML = orders.map(order => `
      <article class="order-card">
        <div class="order-card-head">
          <div>
            <div class="order-number">Захиалга #${Number(order.id)}</div>
            <a class="order-store" href="/stores/${Number(order.store_id)}">${escapeHtml(order.store_name || '')}</a>
            <div class="order-date">${escapeHtml(order.created_at)}</div>
          </div>
          <div class="order-summary">
            <strong>${money(order.total)}</strong>
            <span class="${order.payment_status === 'paid' ? 'is-paid' : ''}">${escapeHtml(paymentLabel(order))}</span>
          </div>
        </div>
        ${orderTimeline(order)}
        <div class="order-items">
          ${(order.items || []).map(item => `
            <div><span>${escapeHtml(item.title)}</span><strong>× ${Number(item.quantity)}</strong></div>
          `).join('')}
        </div>
        ${order.ebarimt_status ? `<div class="order-ebarimt">И-баримт: ${escapeHtml(order.ebarimt_status)}${order.ebarimt_lottery ? ' · ' + escapeHtml(order.ebarimt_lottery) : ''}</div>` : ''}
      </article>
    `).join('');
}
loadOrders().catch(console.error);
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
