<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Захиалга - ЗАМЧ</title>
    {% include "partials/head_meta.html" with context %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/style.css?v=ux4">
</head>
<body class="zamch-shell site-bg">
{% include "partials/nav.html" %}

<main class="zamch-main">
    <div class="container py-5" style="max-width:560px">
        <div class="panel text-center" id="successPanel">
            <div class="mb-3" style="font-size:2.5rem;color:var(--brand)" id="icon"><i class="bi bi-check-circle"></i></div>
            <h1 class="page-title mb-2" style="font-size:1.6rem" id="title">Захиалга амжилттай</h1>
            <p class="text-secondary mb-3" id="subtitle">Таны захиалгыг хүлээн авлаа.</p>
            <div class="fw-bold fs-5 mb-2" id="orderIds"></div>
            <div class="fw-bold mb-3" style="color:var(--brand-deep)" id="total"></div>
            <p class="small text-secondary mb-4" id="extraNote"></p>
            <div class="d-grid gap-2">
                <a href="#" class="btn-zamch btn-zamch-primary" id="payLink" style="display:none">Төлбөр үргэлжлүүлэх</a>
                <a href="/" class="btn-zamch btn-zamch-dark" id="shopLink">Нүүр рүү</a>
                <a href="/my-orders" class="btn btn-outline-dark" id="ordersLink" style="display:none">Миний захиалгууд</a>
                <a href="/login?next=/my-orders" class="btn btn-outline-dark" id="loginLink" style="display:none">Нэвтэрч захиалгаа харах</a>
            </div>
        </div>
    </div>
</main>

{% include "partials/footer.html" %}

<script src="/static/shop.js?v=ux4"></script>
<script>
const params = new URLSearchParams(location.search);
const groupFromUrl = params.get('group') || '';

async function load() {
    const me = await (await fetch('/api/auth/me')).json().catch(() => ({}));
    const loggedIn = !!me.user;
    if (loggedIn) {
        document.getElementById('ordersLink').style.display = '';
    } else {
        document.getElementById('loginLink').style.display = '';
    }

    const last = await (await fetch('/api/orders/last-checkout')).json().catch(() => ({}));
    const data = last.data || null;
    const groupId = groupFromUrl || (data && data.payment_group_id) || '';

    if (data && data.order_ids?.length) {
        setPageTitle(['Захиалга']);
        document.getElementById('orderIds').textContent =
            'Захиалга № ' + data.order_ids.join(', ');
        if (data.total) document.getElementById('total').textContent = money(data.total);
        if (data.store_count > 1) {
            document.getElementById('extraNote').textContent =
                'Олон дэлгүүрийн бараа тул дэлгүүр бүрт тусдаа захиалга үүссэн.';
        }
        if (data.payment_method === 'cod') {
            const pickup = data.delivery_type === 'pickup';
            document.getElementById('subtitle').textContent = pickup
                ? 'Төлбөрөө дэлгүүрт очиж төлнө үү.'
                : 'Төлбөрөө хүргэлт дээр төлнө үү.';
        }
    }

    if (groupId && (!data || data.payment_method === 'qpay')) {
        try {
            const pay = await (await fetch('/api/qpay/check/' + groupId)).json();
            if (pay.amount) document.getElementById('total').textContent = money(pay.amount);
            if (pay.paid) {
                document.getElementById('icon').innerHTML = '<i class="bi bi-check-circle"></i>';
                document.getElementById('title').textContent = 'Төлбөр амжилттай';
                setPageTitle(['Төлбөр амжилттай']);
                document.getElementById('subtitle').textContent = pay.ebarimt_lottery
                    ? `И-баримт: ${pay.ebarimt_lottery}`
                    : 'QPay төлбөр амжилттай хийгдлээ.';
                document.getElementById('payLink').style.display = 'none';
            } else {
                document.getElementById('icon').innerHTML = '<i class="bi bi-hourglass-split"></i>';
                document.getElementById('title').textContent = 'Төлбөр хүлээгдэж байна';
                setPageTitle(['Төлбөр хүлээгдэж байна']);
                document.getElementById('subtitle').textContent = 'Захиалга үүссэн. QPay-ээр төлнө үү.';
                const payLink = document.getElementById('payLink');
                payLink.href = '/payment/' + encodeURIComponent(groupId);
                payLink.style.display = '';
                document.getElementById('shopLink').className = 'btn-zamch btn-zamch-dark';
            }
        } catch (_) {
            document.getElementById('title').textContent = 'Төлбөр хүлээгдэж байна';
            document.getElementById('subtitle').textContent = 'Төлбөр баталгаажсны дараа дахин шалгана уу.';
            const payLink = document.getElementById('payLink');
            payLink.href = '/payment/' + encodeURIComponent(groupId);
            payLink.style.display = '';
        }
    }

    if (!data && !groupId) {
        setPageTitle(['Захиалга олдсонгүй']);
        document.getElementById('title').textContent = 'Захиалгын мэдээлэл олдсонгүй';
        document.getElementById('subtitle').textContent = 'Сагс руу буцаж захиалгаа үргэлжлүүлнэ үү.';
        document.getElementById('orderIds').innerHTML = '<a href="/cart">Сагс руу</a>';
    }
}

load().catch(console.error);
</script>
</body>
</html>
