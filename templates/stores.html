<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дэлгүүрүүд - ЗАМЧ</title>
    {% include "partials/head_meta.html" with context %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/style.css?v=ux4">
</head>
<body class="zamch-shell site-bg">
{% include "partials/nav.html" %}

<main class="zamch-main">
<div class="container py-4 py-md-5">
    <header class="page-head">
        <p class="page-kicker">Дэлгүүр</p>
        <h1 class="page-title">Идэвхтэй дэлгүүр <span id="storesCountNum">—</span></h1>
    </header>
    <div id="storesList" class="stores-grid"></div>
</div>
</main>

{% include "partials/footer.html" %}

<script src="/static/shop.js?v=ux4"></script>
<script>
function storeLogoUrl(logo) {
    if (logo && (String(logo).startsWith('/photos/') || String(logo).startsWith('/static/'))) {
        return String(logo);
    }
    return '/static/placeholder.jpg';
}

async function loadStores() {
    const res = await fetch('/api/stores');
    const data = await res.json();
    const stores = data.data || [];
    const count = Number(data.count ?? stores.length);
    document.getElementById('storesCountNum').textContent = count;

    const box = document.getElementById('storesList');
    if (!stores.length) {
        box.className = '';
        box.innerHTML = emptyState('Идэвхтэй дэлгүүр алга',
            `<a href="/for-sellers" class="btn-zamch btn-zamch-dark btn-sm">Худалдагчдад</a>`);
        return;
    }
    box.innerHTML = stores.map(s => {
        const logo = escapeHtml(storeLogoUrl(s.logo));
        const initial = escapeHtml((s.name || '?').trim().charAt(0).toUpperCase());
        const hasLogo = s.logo && storeLogoUrl(s.logo) !== '/static/placeholder.jpg';
        const products = Number(s.product_count || 0);
        return `
      <a class="store-tile" href="/stores/${Number(s.id)}">
        <span class="store-tile-logo">
          ${hasLogo
            ? `<img src="${logo}" alt="">`
            : `<span class="store-tile-initial">${initial}</span>`}
        </span>
        <span class="store-tile-name">${escapeHtml(s.name)}</span>
        <span class="store-tile-meta">${products} бараа</span>
      </a>`;
    }).join('');
}
loadStores().catch(console.error);
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
